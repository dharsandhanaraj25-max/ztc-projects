version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Navigating to project directory..."
      - cd projects/cloud-support-engineer-projects/project-3/globalmart-catalog
  build:
    commands:
      - echo "Current directory is $(pwd)"
      - npm install
artifacts:
  base-directory: 'projects/cloud-support-engineer-projects/project-3/globalmart-catalog'
  files:
    - '**/*'
    - 'appspec.yml'