version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20  # Use the latest supported version for compatibility
  build:
    commands:
      - echo "Navigating to app directory..."
      - cd projects/cloud-support-engineer-projects/project-3/globalmart-catalog
      - npm install
      - npm run build
      # FIX: Ensure scripts are executable for CodeDeploy
      - chmod +x scripts/*.sh
artifacts:
  base-directory: 'projects/cloud-support-engineer-projects/project-3/globalmart-catalog'
  files:
    - 'build/**/*'      # The React static files
    - 'scripts/**/*'    # The deployment scripts
    - 'appspec.yml'     # The instruction file